# Screenshot tour of Spotlight for the portfolio video — step 3 of capture.sh,
# which has already launched the app and typed the login.
appId: com.yasreb.spotlight
---
- hideKeyboard
- runFlow: dismiss-anr.yaml
- takeScreenshot: 02-login-filled
- tapOn: 'Log in'

# --- Onboarding (first login on this install) -----------------------------------
- extendedWaitUntil:
    visible: 'Everything you own\.'
    timeout: 60000
- startRecording: onboarding
- runScript: { file: pause.js, env: { MS: '2600' } }
- takeScreenshot: 03-onboarding-1-closet
- swipe:
    direction: LEFT
- runScript: { file: pause.js, env: { MS: '2600' } }
- takeScreenshot: 04-onboarding-2-verified
- tapOn: 'Next'
- runScript: { file: pause.js, env: { MS: '2600' } }
- takeScreenshot: 05-onboarding-3-memory
- tapOn: 'Next'
- runScript: { file: pause.js, env: { MS: '2600' } }
- takeScreenshot: 06-onboarding-4-profile
- stopRecording
- tapOn: 'Get started'

# --- Closet -----------------------------------------------------------------------
- runFlow: dismiss-anr.yaml
- extendedWaitUntil:
    visible: 'My Closet'
    timeout: 60000
- runScript: { file: pause.js, env: { MS: '7000' } }
- takeScreenshot: 10-closet
- startRecording: closet
- scroll
- runScript: { file: pause.js, env: { MS: '4000' } }
- takeScreenshot: 11-closet-scrolled
- stopRecording

# One item's ownership page
- scrollUntilVisible:
    element: 'Free RN Flyknit'
    direction: DOWN
    optional: true
- tapOn:
    text: 'Free RN Flyknit'
    optional: true
- runScript: { file: pause.js, env: { MS: '5000' } }
- takeScreenshot: 12-ownership-detail
- scroll
- runScript: { file: pause.js, env: { MS: '1500' } }
- takeScreenshot: 13-ownership-detail-scrolled
- back
- runFlow:
    when:
      notVisible: 'Profile'
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: 'Profile'
          timeout: 60000

# --- Profile + a memory -----------------------------------------------------------
- runFlow: dismiss-anr.yaml
- tapOn: 'Profile'
- runScript: { file: pause.js, env: { MS: '7000' } }
- takeScreenshot: 50-profile
- tapOn:
    point: '17%,30%'
    label: 'Open newest memory'
- runScript: { file: pause.js, env: { MS: '6000' } }
- takeScreenshot: 52-memory-detail
- startRecording: memory
- scroll
- runScript: { file: pause.js, env: { MS: '3000' } }
- takeScreenshot: 53-memory-detail-scrolled
- stopRecording
