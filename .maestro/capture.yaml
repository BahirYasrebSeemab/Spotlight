# Screenshot tour of Spotlight for the portfolio video — step 3 of capture.sh,
# which has already launched the app and typed the login.
# Everything after login is optional so a single miss doesn't lose the rest.
appId: com.yasreb.spotlight
---
- hideKeyboard
- runFlow: dismiss-anr.yaml
- takeScreenshot: 02-login-filled
- tapOn: 'Log in'

# --- Onboarding (shown on first login per install) ---------------------------
- extendedWaitUntil:
    visible: 'Everything you own\.|Your Closet is Empty|Loading your closet\.\.\.'
    timeout: 60000
- runFlow:
    when:
      visible: 'Everything you own\.'
    commands:
      - startRecording: onboarding
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: 03-onboarding-1-closet
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: 04-onboarding-2-verified
      - tapOn: 'Next'
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: 05-onboarding-3-memory
      - tapOn: 'Next'
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: 06-onboarding-4-profile
      - stopRecording
      - tapOn: 'Get started'

# --- Closet ------------------------------------------------------------------
- runFlow: dismiss-anr.yaml
- extendedWaitUntil:
    visible: 'My Closet|Your Closet is Empty'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000
- startRecording: tour
- takeScreenshot: 10-closet
- scroll
- waitForAnimationToEnd
- takeScreenshot: 11-closet-scrolled
- swipe:
    direction: DOWN
- waitForAnimationToEnd

# First closet item -> ownership detail
- tapOn:
    point: '27%,32%'
    optional: true
    label: 'Open first closet item'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 12-ownership-detail
- scroll
- waitForAnimationToEnd
- takeScreenshot: 13-ownership-detail-scrolled
- back
- runFlow:
    when:
      notVisible: 'Activity'
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: 'Activity'
          timeout: 60000

# Explore
- tapOn:
    text: 'Explore'
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 14-explore
- back
- runFlow:
    when:
      notVisible: 'Activity'
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: 'Activity'
          timeout: 60000

# --- Search --------------------------------------------------------------------
- runFlow: dismiss-anr.yaml
- tapOn: 'Search'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 20-search-people
- tapOn:
    text: '(?i)products'
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 21-search-products
- tapOn:
    text: '(?i)brands'
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 22-search-brands

# --- Add ----------------------------------------------------------------------
- runFlow: dismiss-anr.yaml
- tapOn: 'Add'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 30-add

# --- Activity -----------------------------------------------------------------
- runFlow: dismiss-anr.yaml
- tapOn: 'Activity'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 40-activity

# --- Profile ------------------------------------------------------------------
- runFlow: dismiss-anr.yaml
- tapOn: 'Profile'
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 50-profile
- scroll
- waitForAnimationToEnd
- takeScreenshot: 51-profile-scrolled
- swipe:
    direction: DOWN
- waitForAnimationToEnd

# First memory tile -> memory detail
- tapOn:
    point: '17%,72%'
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 52-memory-detail
- scroll
- waitForAnimationToEnd
- takeScreenshot: 53-memory-detail-scrolled
- stopRecording
