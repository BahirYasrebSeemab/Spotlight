name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 05:00 UTC — free-tier Supabase projects pause after 7 days of inactivity, so this is a comfortable margin
    - cron: '0 5 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project 1
        run: |
          curl -s -o /dev/null -w "Project 1 status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL_1 }}/rest/v1/${{ secrets.SUPABASE_TABLE_1 }}?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_1 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_1 }}"

      - name: Ping Supabase Project 2
        run: |
          curl -s -o /dev/null -w "Project 2 status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL_2 }}/rest/v1/${{ secrets.SUPABASE_TABLE_2 }}?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_2 }}"
