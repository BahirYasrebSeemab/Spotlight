# Builds a standalone release APK, boots an Android emulator, logs in with a
# demo account and captures screenshots + a screen recording of the app via
# Maestro. Results are uploaded as the "app-screenshots" artifact.
#
# Required repo secrets:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY  (inlined into the JS bundle)
#   DEMO_EMAIL, DEMO_PASSWORD                                (demo account Maestro logs in with)
name: App screenshots

on:
  workflow_dispatch:
  push:
    branches: [ci/screenshots]

concurrency:
  group: app-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check Supabase secrets
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repo secret $name"; missing=1; fi
          done
          exit $missing

      - name: Install dependencies
        run: bun install

      - name: Build release APK (x86_64 only, for the emulator)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-x86_64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Check demo account secrets
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "$DEMO_EMAIL" ] || [ -z "$DEMO_PASSWORD" ]; then
            echo "::error::Missing repo secrets DEMO_EMAIL / DEMO_PASSWORD — the APK built fine, but the emulator needs a login"
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run app on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: bash .maestro/capture.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            capture-output/
            ~/.maestro/tests/
          if-no-files-found: warn
