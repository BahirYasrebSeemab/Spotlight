# Builds a standalone release APK, boots an Android emulator, logs in with a
# demo account and captures screenshots + a screen recording of the app via
# Maestro. Results are uploaded as the "app-screenshots" artifact.
#
# Required repo secrets:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY  (inlined into the JS bundle)
#   DEMO_EMAIL, DEMO_PASSWORD                                (demo account Maestro logs in with)
#
# Put [reuse-apk] in the commit message to skip the ~15 min build and reuse the
# APK from the latest completed run on this branch (for Maestro-only changes).
name: App screenshots

on:
  workflow_dispatch:
  push:
    branches: [ci/screenshots]

concurrency:
  group: app-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      REUSE_APK: ${{ contains(github.event.head_commit.message, '[reuse-apk]') }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      NODE_ENV: production
    steps:
      # The RN build + emulator system image don't fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia*
          df -h /

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        if: env.REUSE_APK != 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        if: env.REUSE_APK != 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: env.REUSE_APK != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: env.REUSE_APK != 'true'

      - name: Check Supabase secrets
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repo secret $name"; missing=1; fi
          done
          exit $missing

      - name: Install dependencies
        if: env.REUSE_APK != 'true'
        run: bun install

      - name: Build release APK (x86_64 only, for the emulator)
        if: env.REUSE_APK != 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Upload APK
        if: env.REUSE_APK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-x86_64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Reuse the most recently built APK
        if: env.REUSE_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=spotlight-x86_64-apk" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id')
          echo "Reusing APK from run $run_id"
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n spotlight-x86_64-apk -D android/app/build/outputs/apk/release
          ls -la android/app/build/outputs/apk/release

      - name: Check demo account secrets
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "$DEMO_EMAIL" ] || [ -z "$DEMO_PASSWORD" ]; then
            echo "::error::Missing repo secrets DEMO_EMAIL / DEMO_PASSWORD — the APK built fine, but the emulator needs a login"
            exit 1
          fi

      - name: Drop build-only files before booting the emulator
        run: |
          rm -rf node_modules android/app/build/intermediates android/app/.cxx android/build
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run app on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          script: bash .maestro/capture.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            capture-output/
            ~/.maestro/tests/
          if-no-files-found: warn
